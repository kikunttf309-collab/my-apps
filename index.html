<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Tools Enterprise - Service & Maintenance Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN for KPI Reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex">
            <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white tracking-wide">DC Tools Manager</h1>
                    <p class="text-xs text-slate-400">Enterprise Maintenance</p>
                </div>
            </div>

            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium bg-indigo-600 text-white transition">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    <span>Dashboard & KPIs</span>
                </button>
                <button onclick="switchTab('tools')" id="nav-tools" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-toolbox w-5"></i>
                    <span>Tool Service Card</span>
                </button>
                <button onclick="switchTab('pm')" id="nav-pm" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-calendar-check w-5"></i>
                    <span>PM Plan</span>
                </button>
                <button onclick="switchTab('calibration')" id="nav-calibration" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-gauge-high w-5"></i>
                    <span>Calibration Plan</span>
                </button>
                <button onclick="switchTab('breakdowns')" id="nav-breakdowns" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-triangle-exclamation w-5"></i>
                    <span>Breakdown & Spares</span>
                </button>
            </nav>

            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                <p>Plant: Plant-01 (Hosur Line)</p>
                <p class="mt-1 text-emerald-400 font-semibold"><span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1 animate-pulse"></span> System Online</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
                <div class="flex items-center space-x-4">
                    <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard & KPIs</h2>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="openAddToolModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Register New Tool</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div class="p-6 space-y-6">

                <!-- 1. DASHBOARD TAB -->
                <div id="view-dashboard" class="space-y-6">
                    <!-- KPI Cards Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Active Tools</p>
                            <h3 id="kpi-total-tools" class="text-3xl font-bold text-slate-800 mt-2">124</h3>
                            <span class="text-xs text-emerald-600 font-medium mt-1 inline-block"><i class="fa-solid fa-arrow-up"></i> +4 added this month</span>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">PM Compliance</p>
                            <h3 class="text-3xl font-bold text-indigo-600 mt-2">96.4%</h3>
                            <span class="text-xs text-slate-500 mt-1 inline-block">Target: > 95%</span>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Calibration Due (30 Days)</p>
                            <h3 id="kpi-calib-due" class="text-3xl font-bold text-amber-600 mt-2">7</h3>
                            <span class="text-xs text-amber-600 font-medium mt-1 inline-block">Action required</span>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Open Breakdowns</p>
                            <h3 id="kpi-open-breakdowns" class="text-3xl font-bold text-rose-600 mt-2">2</h3>
                            <span class="text-xs text-rose-600 font-medium mt-1 inline-block">Avg MTTR: 42 mins</span>
                        </div>
                    </div>

                    <!-- Charts Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-slate-200
